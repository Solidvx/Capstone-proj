<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="04  공격 노드 — 전원선은 신호선과 별도로 연결"><title>04  공격 노드 — 전원선은 신호선과 별도로 연결</title><style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#182c43;font-size:19px}.small{font-size:16px}.title{font-size:26px;font-weight:700}</style><rect width="1000" height="520" fill="#f5f8fc"/><text x="30" y="42" class="title">04  공격 노드 — 전원선은 신호선과 별도로 연결</text><rect x="30" y="95" width="265" height="340" rx="12" fill="#e6f3ff" stroke="#a8bbce" stroke-width="2"/><text x="46" y="125" class="">Pi3 전원 핀</text><rect x="640" y="95" width="330" height="340" rx="12" fill="#fff1df" stroke="#a8bbce" stroke-width="2"/><text x="656" y="125" class="">연결할 단자</text><text x="45" y="175" class="">물리 1번 · 3.3V</text><polyline points="295,169 640,169" fill="none" stroke="#b45a00" stroke-width="5"/><text x="653" y="175" class="small">LC1 LV + LC2 LV</text><text x="45" y="270" class="">물리 2번 · 5V</text><polyline points="295,264 640,264" fill="none" stroke="#b22e45" stroke-width="5"/><text x="653" y="270" class="small">LC1 HV + LC2 HV + MCP VCC</text><text x="45" y="365" class="">물리 6번 · GND</text><polyline points="295,359 640,359" fill="none" stroke="#536c85" stroke-width="5"/><text x="653" y="365" class="small">LC1 GND + LC2 GND + MCP GND</text><text x="330" y="210" class="small">한 전원 핀을 필요한 단자들로 분배</text><text x="30" y="474" class="small">LV / HV는 전원 단자. LV1 / HV1처럼 숫자가 붙은 단자는 신호 채널.</text></svg>