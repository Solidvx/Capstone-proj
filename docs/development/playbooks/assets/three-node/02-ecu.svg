<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="02  ECU 조립 — 헤더 연결과 가변저항 세 선"><title>02  ECU 조립 — 헤더 연결과 가변저항 세 선</title><style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#182c43;font-size:19px}.small{font-size:16px}.title{font-size:26px;font-weight:700}</style><rect width="1000" height="600" fill="#f5f8fc"/><text x="30" y="42" class="title">02  ECU 조립 — 헤더 연결과 가변저항 세 선</text><rect x="30" y="100" width="230" height="120" rx="12" fill="#e6f3ff" stroke="#a8bbce" stroke-width="2"/><text x="46" y="130" class="">ECU Raspberry Pi 4</text><text x="46" y="160" class="small">전원을 뺀 상태</text><text x="46" y="186" class="small">40핀 헤더의 pin 1 확인</text><rect x="365" y="100" width="230" height="120" rx="12" fill="#ffffff" stroke="#a8bbce" stroke-width="2"/><text x="381" y="130" class="">E3P 확장보드</text><text x="381" y="160" class="small">같은 GPIO를 나눠 연결</text><text x="381" y="186" class="small">실물 pin 1 표시 확인</text><rect x="705" y="85" width="265" height="115" rx="12" fill="#e8f6ee" stroke="#a8bbce" stroke-width="2"/><text x="721" y="115" class="">SEENGREAT CAN</text><text x="721" y="145" class="small">40핀 헤더로 연결</text><text x="721" y="171" class="small">로직 스위치 3.3V</text><rect x="705" y="280" width="265" height="120" rx="12" fill="#e8f6ee" stroke="#a8bbce" stroke-width="2"/><text x="721" y="310" class="">ADS1115 ADC</text><text x="721" y="340" class="small">40핀 헤더로 연결</text><text x="721" y="366" class="small">센서 입력 A0 사용</text><polyline points="260,160 365,160" fill="none" stroke="#536c85" stroke-width="8"/><polyline points="595,150 705,150" fill="none" stroke="#536c85" stroke-width="8"/><polyline points="595,180 640,180 640,310 705,310" fill="none" stroke="#536c85" stroke-width="8"/><text x="30" y="265" class="small">굵은 회색 선 = 40핀 헤더 연결 관계 (점퍼선 한 가닥이 아님)</text><rect x="30" y="330" width="260" height="160" rx="12" fill="#fff1df" stroke="#a8bbce" stroke-width="2"/><text x="46" y="360" class="">가변저항 모듈</text><text x="46" y="390" class="small">VCC   → ECU 3.3V</text><text x="46" y="416" class="small">GND  → ECU GND</text><text x="46" y="442" class="small">OUT  → ADC의 A0</text><polyline points="290,365 355,365 355,290" fill="none" stroke="#b45a00" stroke-width="3"/><text x="370" y="298" class="small">ECU 물리 1 또는 17번 · 3.3V</text><polyline points="290,405 405,405 405,335" fill="none" stroke="#536c85" stroke-width="3"/><text x="420" y="340" class="small">ECU 물리 6번 · GND</text><polyline points="290,460 830,460 830,400" fill="none" stroke="#7c4eae" stroke-width="3"/><text x="445" y="450" class="small">OUT → A0 (0~3.3V)</text><text x="30" y="535" class="small">IVI는 더 간단: Raspberry Pi 4의 40핀 헤더 ↔ SEENGREAT CAN 보드</text><text x="30" y="572" class="small">개념도: E3P 커넥터의 실제 위치·쌓는 순서·방향을 그린 그림은 아님</text></svg>